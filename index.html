<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U Coffee — App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --burg:#7A3F08; --wine:#3E2207; --creme:#F7E8D6; --creme2:#FBF2E6;
  --esp:#3B2412; --latte:#C99A6B; --rose:#C99A6B; --blush:#E3C29E;
  --muted:#8C6A4C; --line:#EAD6BC; --ok:#4E7D5B; --warn:#B5532E;
  --serif:'EB Garamond', Georgia, serif; --sans:'Quicksand', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--esp);background:
  radial-gradient(1200px 600px at 80% -10%, #EBCFAE 0%, transparent 60%),
  radial-gradient(900px 500px at -10% 110%, #E9CBAA 0%, transparent 55%), #F2DCC4;
  display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.stage{display:flex;align-items:center;gap:56px}
.side{max-width:300px}
.side h1{font-family:var(--serif);font-weight:700;font-size:44px;color:var(--burg);line-height:1.05;letter-spacing:-.5px}
.side p{margin-top:14px;font-size:15px;line-height:1.55;color:var(--esp)}
.side .hint{margin-top:18px;font-size:13px;color:var(--muted)}
.side .chips{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.side .chips span{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
@media (max-width:820px){.side{display:none}}

/* ---------- phone frame ---------- */
.phone-wrap{transform-origin:center center}
.phone{width:420px;height:874px;border-radius:62px;background:#1b1312;padding:14px;position:relative;
  box-shadow:0 0 0 2px #3b2a27, 0 40px 80px -20px rgba(75,15,28,.45), 0 18px 30px -10px rgba(0,0,0,.35)}
.phone:before{content:"";position:absolute;left:-3px;top:170px;width:3px;height:64px;background:#2a1d1b;border-radius:2px 0 0 2px;box-shadow:0 84px 0 #2a1d1b}
.phone:after{content:"";position:absolute;right:-3px;top:220px;width:3px;height:96px;background:#2a1d1b;border-radius:0 2px 2px 0}
.screen{width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--creme2);position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:50}
.status{height:52px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 8px 34px;font-weight:600;font-size:15px;z-index:40}
.status .icons{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--esp);opacity:.85;z-index:60}

/* ---------- app chrome ---------- */
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:86px;padding:8px 10px 26px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--sans);color:#B39478;cursor:pointer;padding-top:4px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--burg)}
.hidden{display:none!important}

h2.title{font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:-.4px;color:var(--esp);margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px}
.card{background:#fff;border-radius:22px;padding:16px;border:1px solid var(--line);margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{border:0;border-radius:16px;padding:14px 16px;font:700 15px var(--sans);cursor:pointer;transition:transform .08s, opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--burg);color:var(--creme)}
.btn.ghost{background:var(--creme);color:var(--burg)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:7px 12px;font:600 13px var(--sans);border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--esp)}
.pill.on{background:var(--burg);color:var(--creme);border-color:var(--burg)}
.seg{display:flex;background:var(--creme);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font:600 13px var(--sans);color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--burg);box-shadow:0 1px 3px rgba(58,34,32,.12)}
.label{font:700 11px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

/* header */
.apphead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.brand{display:flex;align-items:center;gap:4px;font-family:var(--serif);font-weight:800;font-size:20px;color:var(--burg)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--burg);color:var(--creme);display:grid;place-items:center;font:700 15px var(--sans);border:0;cursor:pointer}

/* dial */
.dialcard{background:linear-gradient(180deg,#fff, #FBF2E6);border-radius:26px;padding:18px 16px 16px;border:1px solid var(--line);margin-top:12px;text-align:center}
.dialcard h3{font-family:var(--serif);font-size:21px;font-weight:700}
.dial{width:100%;max-width:300px;margin:8px auto 0;display:block}
.dial .seg-arc{cursor:pointer;transition:opacity .2s, stroke-width .2s}
.lvl-big{font-family:var(--serif);font-weight:800;font-size:46px;line-height:1;margin-top:-66px;color:var(--burg)}
.lvl-name{font:700 16px var(--sans);margin-top:4px}
.lvl-mg{font-size:13px;color:var(--muted);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;margin:16px 0 4px;
  background:linear-gradient(90deg,#F7E8D6,#E3C29E,#C99A6B,#7A3F08,#3E2207);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--burg);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--burg);cursor:grab}
.ticks{display:flex;justify-content:space-between;font:600 11px var(--sans);color:var(--muted);padding:0 2px}

.suggest{display:flex;align-items:center;gap:10px;background:var(--creme);border-radius:16px;padding:10px 12px;margin-top:12px;text-align:left;font-size:13px;cursor:pointer;border:0;width:100%;color:var(--esp);font-family:var(--sans)}
.suggest b{color:var(--burg)}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:#FBE9E2;border:1px solid #F0C9B8;color:#7a3218;border-radius:16px;padding:11px 12px;margin-top:10px;text-align:left;font-size:13px;line-height:1.4}
.warnbox button{margin-top:6px;border:0;background:var(--warn);color:#fff;border-radius:10px;padding:6px 10px;font:700 12px var(--sans);cursor:pointer}

.canrow{display:flex;gap:14px;align-items:center}
.flavors{display:flex;flex-direction:column;gap:7px;flex:1}
.flv{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px;cursor:pointer;font-family:var(--sans);color:var(--esp)}
.flv b{display:block;font-size:13.5px}
.flv span{font-size:11.5px;color:var(--muted)}
.flv.on{border-color:var(--burg);box-shadow:inset 0 0 0 1px var(--burg);background:#FFF9F4}

.meter{height:12px;border-radius:12px;background:var(--creme);overflow:hidden;margin-top:10px;position:relative}
.meter i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--rose),var(--burg));transition:width .5s}
.meter.over i{background:linear-gradient(90deg,#E39A7A,var(--warn))}

/* day timeline */
.tl{margin-top:14px;position:relative}
.tl:before{content:"";position:absolute;left:47px;top:10px;bottom:10px;width:2px;background:var(--line)}
.slot{display:flex;gap:12px;align-items:center;margin-bottom:12px;position:relative}
.slot .t{width:38px;font:700 12px var(--sans);color:var(--muted);text-align:right}
.slot .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--creme2);flex:none;z-index:1}
.slot .body{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.slot .body .what{flex:1}
.slot .body .what b{font-size:14px;display:block}
.slot .body .what span{font-size:12px;color:var(--muted)}
.lvbadge{font:800 13px var(--serif);border-radius:10px;padding:6px 8px;min-width:40px;text-align:center;border:0;cursor:pointer}

/* shop */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.boxslot{aspect-ratio:.72;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;background:#fff;cursor:pointer;position:relative;padding:4px}
.boxslot.filled{border-style:solid;border-color:transparent;background:var(--creme)}
.boxslot .x{position:absolute;top:3px;right:5px;font-size:12px;color:var(--muted)}
.pickcans{display:flex;justify-content:space-between;margin-top:10px}
.pickcan{border:2px solid transparent;border-radius:14px;background:none;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px var(--sans);color:var(--esp)}
.pickcan.on{border-color:var(--burg);background:#fff}
.pack{display:flex;gap:12px;align-items:center}
.pack .info{flex:1}
.pack .info b{font-family:var(--serif);font-size:17px}
.pack .info p{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.price{font:800 18px var(--serif);color:var(--burg)}

/* map */
.map{border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-top:12px;position:relative;background:#EFE6D6}
.map svg{display:block;width:100%}
.pin{cursor:pointer}
.stock{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.stock div{text-align:center;font:700 11px var(--sans);border-radius:12px;padding:8px 2px;background:var(--creme)}
.stock div small{display:block;font-weight:600;font-size:10px;margin-top:2px}
.in{color:var(--ok)} .low{color:var(--warn)} .out{color:#aaa}

/* profile */
.ring{width:92px;height:92px;flex:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.badge{border-radius:16px;background:var(--creme);padding:10px 6px;text-align:center;font:700 11.5px var(--sans)}
.badge.locked{opacity:.4}
.badge .ic{font-family:var(--serif);font-size:20px;color:var(--burg);display:block;margin-bottom:2px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border-bottom:0}
.setrow span{color:var(--muted);font-weight:600}
.code{font:800 16px var(--serif);letter-spacing:1px;color:var(--burg)}

/* onboarding */
.onb{position:absolute;inset:0;background:var(--creme);z-index:30;display:flex;flex-direction:column;padding:64px 26px 40px}
.onb .steps{display:flex;gap:6px;margin-bottom:26px}
.onb .steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.onb .steps i.on{background:var(--burg)}
.onb h2{font-family:var(--serif);font-weight:800;font-size:31px;line-height:1.1;letter-spacing:-.4px}
.onb p.lead{color:var(--muted);margin-top:10px;font-size:15px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;cursor:pointer;font-family:var(--sans);color:var(--esp)}
.opt b{display:block;font-size:15px}
.opt span{font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--burg);background:#FFF8F2;box-shadow:inset 0 0 0 1px var(--burg)}
.onb .grow{flex:1}
.onb input.text{width:100%;margin-top:22px;border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;font:500 17px var(--sans);background:#fff;color:var(--esp);outline:none}
.onb input.text:focus{border-color:var(--burg)}
.splash{align-items:center;justify-content:center;text-align:center;background:#F2DCC4;color:var(--burg)}
.splash h1{font-family:var(--serif);font-size:52px;font-weight:600;margin-top:4px;line-height:1}
.splash p{margin-top:6px;font-size:16px}
.splash p.tag{font:600 19px var(--sans);letter-spacing:3px;margin-top:18px}
.splash .btn{background:var(--burg);color:#F7E8D6;margin-top:40px;width:100%}
.splash .scale{display:flex;gap:6px;margin-top:26px}
.splash .scale span{width:34px;height:52px;border-radius:9px;display:grid;place-items:end center;padding-bottom:5px;font:800 11px var(--serif)}

/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(43,20,18,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--creme2);border-radius:30px 30px 0 0;padding:12px 22px 40px;z-index:80;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none;visibility:visible}
.sheet{visibility:hidden}
.sheet.on,.sheet{transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--serif);font-size:24px;font-weight:800}
.toast{position:absolute;left:20px;right:20px;bottom:100px;background:var(--esp);color:var(--creme);border-radius:16px;padding:13px 16px;font:600 14px var(--sans);z-index:90;transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:none}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="side">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" id="sideLogo"></svg>
    <h1>U Coffee</h1>
    <p><b>Made for U.</b> Choose exactly how awake you want to be, from U0 Dream (decaf) to U4 Wide Awake (200&nbsp;mg).</p>
    <div class="chips" aria-hidden="true">
      <span style="background:#F7E8D6"></span><span style="background:#E3C29E"></span><span style="background:#C99A6B"></span><span style="background:#7A3F08"></span><span style="background:#3E2207"></span>
    </div>
    <p class="hint">Clickable prototype for the University of Miami campus. Tap through onboarding, turn the dial, log a can, build a weekly box, and tap pins on the campus map.</p>
  </div>

  <div class="phone-wrap" id="phoneWrap">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="island"></div>
        <div class="status"><span id="clock">9:41</span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 8.9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4.2-4.5L2.2 5.4a8.2 8.2 0 0 1 11.6 0L12.2 7a5.9 5.9 0 0 0-8.4 0ZM.6 3.8-.9 2.2a12.5 12.5 0 0 1 17.8 0l-1.5 1.6a10.3 10.3 0 0 0-14.8 0Z" fill="currentColor"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
          </span>
        </div>
        <main id="view"></main>
        <nav class="tabbar" id="tabbar"></nav>
        <div id="onb"></div>
        <div class="scrim" id="scrim"></div>
        <div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
        <div class="toast" id="toast"></div>
        <div class="homebar"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= DATA ================= */
const LEVELS = [
  {id:0, code:'U0', name:'Dream',      mg:5,   feel:'All the taste, none of the buzz', color:'#F7E8D6', ink:'#7A3F08'},
  {id:1, code:'U1', name:'Ease',       mg:50,  feel:'A light lift',                   color:'#E3C29E', ink:'#7A3F08'},
  {id:2, code:'U2', name:'Steady',     mg:100, feel:'About one cup of coffee',        color:'#C99A6B', ink:'#3E2207'},
  {id:3, code:'U3', name:'Focus',      mg:150, feel:'Locked onto the task',           color:'#7A3F08', ink:'#F7E8D6'},
  {id:4, code:'U4', name:'Wide Awake', mg:200, feel:'Our strongest boost, capped at 200 mg', color:'#3E2207', ink:'#F7E8D6'},
];
const FLAVORS = [
  {id:'classic', name:'Classic Cold Brew', note:'Smooth, low-acid, lightly sweet'},
  {id:'creme',   name:'Crème Latte',       note:'Oat milk and vanilla bean'},
  {id:'dulce',   name:'Dulce Mocha',       note:'Cocoa and dulce de leche'},
];
const TIMES = [
  {id:'morning',   label:'Morning'},
  {id:'afternoon', label:'Afternoon'},
  {id:'night',     label:'Late night'},
];
const PLACES = [
  {id:'lib',   name:'Richter Library',            hint:'Ground-floor fridge by the study rooms', x:92,  y:92,  walk:4, stock:[2,2,1,2,1]},
  {id:'bus',   name:'Herbert Business School',    hint:'Lobby vending',                          x:262, y:74,  walk:6, stock:[1,2,2,2,1]},
  {id:'cv',    name:'Centennial Village',         hint:'Dining hall cold case',                  x:96,  y:186, walk:3, stock:[2,1,2,1,0]},
  {id:'sc',    name:'Shalala Student Center',     hint:'Next to the food court',                 x:236, y:238, walk:2, stock:[2,2,2,1,0]},
  {id:'lv',    name:'Lakeside Village',           hint:'Front desk fridge, 24/7',                x:300, y:168, walk:5, stock:[2,1,0,1,2]},
  {id:'well',  name:'Herbert Wellness Center',    hint:'Next to the smoothie bar',               x:146, y:288, walk:7, stock:[2,2,1,0,0]},
  {id:'metro', name:'University Metrorail',       hint:'For commuters, at the US-1 entrance',    x:340, y:268, walk:8, stock:[1,1,2,2,2]},
];
const HOMES = [
  {name:'Centennial Village', short:'Centennial Village', note:'Biscayne, Coral, Grove, Ibis or Vista', near:'cv'},
  {name:'Eaton Residential College', short:'Eaton', note:'Part of Centennial Village, on Lake Osceola', near:'cv'},
  {name:'Lakeside Village', short:'Lakeside Village', note:'Upper-class housing', near:'lv'},
  {name:'University Village', short:'University Village', note:'Apartments for juniors and seniors', near:'sc'},
  {name:'Off campus', short:'commute', note:'I commute to Coral Gables', near:'metro'},
];
const place = id => PLACES.find(p=>p.id===id);
const homeOf = () => HOMES[S.home ?? 0];
const STOCKTXT=['Out','Low','In stock'], STOCKCLS=['out','low','in'];

/* ================= STATE ================= */
const S = {
  onbStep:0, name:'', tolerance:null, sleep:null, firstClass:null,
  home:null, tab:'home', level:2, flavor:'classic', time:'morning',
  caffeine:0, limit:400, cans:7, streak:4, log:[],
  box:[], pickLevel:2, pickFlavor:'classic', shopTab:'box', subscribed:false,
  place:null, mapFilter:null,
};

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = i => LEVELS[i];
const flavor = id => FLAVORS.find(f=>f.id===id);

function logoSVG(size=28, fg='#7A3F08'){
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-label="U Coffee logo">
    <text x="2" y="54" font-family="EB Garamond" font-weight="800" font-size="66" fill="${fg}">U</text>
    <circle cx="56" cy="49" r="5.5" fill="${fg}"/></svg>`;
}
function canSVG(lv, fl, w=70){
  const l=L(lv), h=w*1.75;
  const f = flavor(fl).name.split(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 80 140" aria-label="${l.code} ${esc(flavor(fl).name)} can">
    <defs><linearGradient id="sh${lv}${fl}${w}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".35" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs>

function recommend(time){

  return Math.min(4, 2 + tol);
}

      <input class="text" id="nameIn" placeholder="Your first name" value="${esc(S.name)}" maxlength="16" autocomplete="off">

  } else {
    const Q = {
      2:{key:'tolerance', h:'How does a full cup of coffee hit you?', p:'This sets where your dial starts in the morning.',
         o:[['Jittery fast','I feel even a small coffee'],['Just right','One cup a day is my normal'],['Barely notice','I can drink coffee at 4 PM and sleep fine']]},
      3:{key:'sleep', h:'What time do you want to be asleep?', p:"We'll warn you before a can that could keep you up.",
         o:[['Before 11 PM','Early bird'],['Around midnight','Pretty typical'],['After 1 AM','Night owl']]},
      5:{key:'home', h:'Where do you live at The U?', p:'We stock the fridge closest to you and deliver your box there.',
         o:HOMES.map(h=>[h.name,h.note])},
      4:{key:'firstClass', h:'When is your first class most days?', p:'We build your day plan around it.',
         o:[['8:00 AM','The brave ones'],['10:00 AM','The sweet spot'],['Noon or later','Built a smart schedule']]},
    }[S.onbStep];

      <div class="opts">${Q.o.map((o,i)=>`<button class="opt ${S[Q.key]===i?'on':''}" data-opt="${i}"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>
      <div class="grow"></div>
      <button class="btn primary block" data-onb-next ${S[Q.key]==null?'disabled':''}>${S.onbStep===5?'See my campus plan':'Continue'}</button>`;
    el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{ S[Q.key]=+b.dataset.opt; renderOnb(); });

function dialSVG(){
  // semicircle with 5 arc segments
  const cx=150, cy=150, r=118, sw=30, gap=0.04;
  let out='';
  for(let i=0;i<5;i++){
    const a0=Math.PI + i*(Math.PI/5) + gap, a1=Math.PI + (i+1)*(Math.PI/5) - gap;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const on=i===S.level;
    out+=`<path class="seg-arc" data-lv="${i}" d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"
      stroke="${L(i).color}" stroke-width="${on?sw+8:sw}" fill="none" stroke-linecap="butt" opacity="${on?1:.55}" ${i===0?'style="filter:drop-shadow(0 0 .6px rgba(58,34,32,.5))"':''}/>`;
    const am=(a0+a1)/2, lx=cx+(r+31)*Math.cos(am), ly=cy+(r+31)*Math.sin(am);
    out+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-family="Quicksand" font-weight="700" font-size="12" fill="${on?'#7A3F08':'#B39478'}" style="pointer-events:none">${L(i).code}</text>`;
  }
  return `<svg class="dial" viewBox="-10 0 320 165">${out}</svg>`;
}

        <rect x="280" y="138" width="50" height="40" rx="6"/><rect x="118" y="282" width="62" height="34" rx="6"/>
      </g>
      <g font-size="8" font-weight="700" fill="#8C6A4C" text-anchor="middle">
        <text x="93" y="112">Richter Library</text><text x="269" y="94">Herbert Business</text>
        <text x="84" y="208">Centennial Village</text><text x="244" y="275">Shalala Center</text>
        <text x="305" y="190">Lakeside Village</text><text x="149" y="328">Wellness Center</text>
      </g>
      <circle cx="40" cy="300" r="14" fill="#D9DDB8"/><circle cx="62" cy="316" r="10" fill="#D9DDB8"/><circle cx="320" cy="52" r="12" fill="#D9DDB8"/>
      <g transform="translate(205 120)"><circle r="8" fill="#3B2412" opacity=".15"/><circle r="5.5" fill="#fff"/><circle r="3.2" fill="#3B2412"/></g>
      ${pins}
    </svg>
  </div>
  ${p?`<div class="card fade">
      <div class="row between"><div><b style="font-family:var(--serif);font-size:18px">${p.name}</b><div class="sub" style="font-size:12.5px">${p.hint} · ${p.walk} min walk</div></div></div>
      <div class="stock">${LEVELS.map((l,i)=>`<div style="background:${l.color};color:${l.ink}">${l.code}<small class="${STOCKCLS[p.stock[i]]}" style="${i>=3&&p.stock[i]?'color:#F7E8D6':''}">${STOCKTXT[p.stock[i]]}</small></div>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" style="flex:1" id="directions">Directions</button><button class="btn ghost" style="flex:1" id="reserve">Hold a can</button></div>
    </div>`
  :`<div class="card" style="text-align:center;color:var(--muted);font-size:14px">Tap a pin to see what's in stock.</div>`}`;
}
function meView(){
  const toFree = 10 - (S.cans % 10);
  const prog = (S.cans % 10)/10;
  const C=2*Math.PI*38;
  const code = 'U-' + (S.name||'ALEX').toUpperCase().replace(/[^A-Z]/g,'').slice(0,8);
  const badges=[
    ['U0','Night Owl','Logged a U0 after 9 PM', S.log.includes(0)],
    ['4','Streak','4 days in a row', true],
    ['F','Finals Mode','Turned on Finals Mode', !!S.examMode],
    ['8','Box Builder','Started a weekly box', S.subscribed],
    
    ['R','Richter Regular','5 cans at Richter Library', false],
    ['+','Recruiter','A friend used your code', false],
  ];
  return `${header()}<h2 class="title">U Points</h2>
  <div class="card row" style="gap:16px">
    <svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" stroke="#F7E8D6" stroke-width="10" fill="none"/>
      <circle cx="46" cy="46" r="38" stroke="#7A3F08" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-prog)}" transform="rotate(-90 46 46)" style="transition:stroke-dashoffset .6s"/>
      <text x="46" y="44" text-anchor="middle" font-family="EB Garamond" font-weight="800" font-size="22" fill="#3B2412">${S.cans%10}/10</text>
      <text x="46" y="60" text-anchor="middle" font-family="Quicksand" font-weight="600" font-size="10" fill="#8C6A4C">cans</text></svg>
    <div><b style="font-family:var(--serif);font-size:19px">${toFree} more to a free can</b><div class="sub" style="font-size:13px;margin-top:4px">${S.cans} cans total · ${S.streak}-day streak</div></div>
  </div>
  <div class="card"><div class="label">Badges</div>
    <div class="badges">${badges.map(b=>`<div class="badge ${b[3]?'':'locked'}"><span class="ic">${b[0]}</span>${b[1]}<div style="font-weight:500;font-size:10px;color:var(--muted);margin-top:2px">${b[2]}</div></div>`).join('')}</div></div>
  <div class="card">
    <div class="label">Invite a friend</div>
    <div class="row between" style="margin-top:8px"><span class="code">${code}</span><button class="pill" id="copyCode">Copy</button></div>
    <div class="sub" style="font-size:12.5px;margin-top:6px">They get a free Sampler. You get 3 cans.</div>
  </div>
  <div class="card" style="padding:6px 16px">
    <div class="setrow">Home base <span>${esc(homeOf().name)}</span></div>
    <div class="setrow">Weekly box <span>${S.subscribed?'Active · $24/week':'Not started'}</span></div>
    <div class="setrow">Daily caffeine limit <span>${S.limit} mg</span></div>
    <div class="setrow">Bedtime <span>${['Before 11 PM','Around midnight','After 1 AM'][S.sleep??1]}</span></div>
    <div class="setrow">Campus ambassador <span style="color:var(--burg);cursor:pointer" id="amb">Apply &rarr;</span></div>
  </div>
  <button class="btn ghost block" style="margin-top:14px" id="restart">Restart demo</button>`;
}

/* ================= RENDER + EVENTS ================= */
function render(){
  renderTabs();
  const v=$('#view');
  v.innerHTML = {home:homeView, day:dayView, shop:shopView, map:mapView, me:meView}[S.tab]();
  v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade');
  bind();
}
function addToBox(lv,fl){
  if(S.box.length>=8){ toast('Your box is full. Tap a can to swap it out.'); return false; }
  S.box.push({lv,fl}); return true;
}
function bind(){
  const v=$('#view');
  v.querySelectorAll('[data-near]').forEach(b=>b.onclick=()=>{ S.place=b.dataset.near; S.mapFilter=null; S.tab='map'; render(); });
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.go; if(S.tab==='map') S.mapFilter=S.level; render(); });
  $('#screen').querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{S.tab='me';render();});
  // home
  v.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ S.time=b.dataset.time; S.level=recommend(S.time); render(); });
  v.querySelectorAll('.seg-arc').forEach(a=>a.onclick=()=>{ S.level=+a.dataset.lv; render(); });
  v.querySelectorAll('[data-setlv]').forEach(b=>b.onclick=()=>{ S.level=+b.dataset.setlv; render(); });
  const rg=$('#lvRange'); if(rg) rg.oninput=()=>{ S.level=+rg.value; render(); const r2=$('#lvRange'); r2&&r2.focus(); };
  v.querySelectorAll('[data-flv]').forEach(b=>b.onclick=()=>{ S.flavor=b.dataset.flv; render(); });
  const dr=$('#drink'); if(dr) dr.onclick=()=>{
    const l=L(S.level);
    if(S.caffeine + l.mg > S.limit){
      openSheet(`<h3>That would put you over</h3><p class="sub" style="margin-top:6px;font-size:14px">${l.code} adds ${l.mg} mg. You're at ${S.caffeine} of your ${S.limit} mg today.</p>
        <div class="row" style="margin-top:16px">${canSVG(0,S.flavor,54)}<div style="flex:1;font-size:14px">Try <b>U0 Dream</b>: same ${esc(flavor(S.flavor).name)}, no buzz.</div></div>
        <div class="row" style="margin-top:18px"><button class="btn ghost" style="flex:1" id="anyway">Log anyway</button><button class="btn primary" style="flex:1" id="swap0">Switch to U0</button></div>`);
      $('#swap0').onclick=()=>{ closeSheet(); S.level=0; logCan(); };
      $('#anyway').onclick=()=>{ closeSheet(); logCan(); };
      return;
    }
    logCan();
  };
  const ab=$('#addBox'); if(ab) ab.onclick=()=>{ if(addToBox(S.level,S.flavor)) toast(`Added ${L(S.level).code} ${flavor(S.flavor).name} to your box (${S.box.length}/8)`); };
  // day
  v.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ const p=dayPlan()[+b.dataset.plan]; S.time=p.time; S.level=+b.dataset.lv; S.tab='home'; render(); toast(`Dial set to ${L(S.level).code} for ${p.what.toLowerCase()}`); });
  v.querySelectorAll('[data-at]').forEach(a=>a.onclick=e=>{ e.preventDefault(); S.place=a.dataset.at; S.mapFilter=null; S.tab='map'; render(); });
  const et=$('#examToggle'); if(et) et.onclick=()=>{ S.examMode=!S.examMode; render(); if(S.examMode) toast('Finals Mode on. Good luck!'); };
  const pb=$('#planToBox'); if(pb) pb.onclick=()=>{
    const plan=dayPlan(); S.box=[];
    [0,1,2,3,0,1,4,3].forEach((k,i)=>{ const p=plan[k%plan.length]; const lv=S.examMode&&p.time!=='night'?Math.min(4,p.lv+1):p.lv; S.box.push({lv, fl:FLAVORS[i%3].id}); });
    S.tab='shop'; S.shopTab='box'; render(); toast('Your box is filled from your day plan');
  };
  // shop
  v.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{ S.shopTab=b.dataset.shop; render(); });
  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ S.pickLevel=+b.dataset.pick; render(); });
  v.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{ S.pickFlavor=b.dataset.pf; render(); });
  v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ S.box.splice(+b.dataset.rm,1); render(); });
  const ap=$('#addPick'); if(ap) ap.onclick=()=>{ if(addToBox(S.pickLevel,S.pickFlavor)) render(); };
  const sb=$('#subscribe'); if(sb) sb.onclick=()=>{
    const counts=LEVELS.map(l=>S.box.filter(c=>c.lv===l.id).length);
    openSheet(`<h3>Your weekly box</h3>
      <div class="row" style="gap:4px;margin-top:12px;flex-wrap:wrap">${LEVELS.map((l,i)=>counts[i]?`<span class="pill" style="background:${l.color};color:${l.ink};border:0">${counts[i]}&times; ${l.code}</span>`:'').join('')}</div>
      <div class="label" style="margin-top:16px">How do you want it?</div>
      <div class="seg" style="margin-top:8px" id="deliv">${S.home===4?`<button class="on" data-d="Pickup at University Metrorail">Metrorail fridge</button><button data-d="Pickup at Shalala">Shalala pickup</button>`
      :`<button class="on" data-d="Delivered to ${esc(homeOf().name)}">${esc(homeOf().short)}</button><button data-d="Pickup at Shalala">Shalala pickup</button>`}</div>
      <div class="label" style="margin-top:14px">Pay with</div>
      <div class="seg" style="margin-top:8px" id="pay"><button class="on">'Cane Card</button><button>Apple Pay</button><button>Card</button></div>
      <div class="row between" style="margin-top:16px;font-size:14px"><span>8 cans every Monday</span><b class="price">$24</b></div>
      <button class="btn primary block" style="margin-top:16px" id="confirmSub">Confirm subscription</button>
      <p class="sub" style="text-align:center;font-size:12px;margin-top:8px">Prototype: no payment is taken.</p>`);
    let d=$('#deliv button').dataset.d; $('#pay').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#pay').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
    $('#deliv').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#deliv').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); d=b.dataset.d; });
    $('#confirmSub').onclick=()=>{ S.subscribed=true; closeSheet(); render(); toast(`Subscribed! ${d}, every Monday`); };
  };
  v.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>toast(`${['Richter Finals Pack','Game Day Pack','U Scale Sampler'][+b.dataset.pack]} added to your cart`));
  // map
  v.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ S.mapFilter = b.dataset.filter==='all'?null:+b.dataset.filter; render(); });
  v.querySelectorAll('[data-place]').forEach(g=>g.onclick=()=>{ S.place=g.dataset.place; render(); });
  const di=$('#directions'); if(di) di.onclick=()=>toast('Walking directions started');
  const rs=$('#reserve'); if(rs) rs.onclick=()=>toast(`A ${L(S.level).code} is held for you for 30 minutes`);
  // me
  const cc=$('#copyCode'); if(cc) cc.onclick=async()=>{ const t=v.querySelector('.code').textContent; try{ await navigator.clipboard.writeText(t); toast('Code copied'); }catch(e){ toast('Your code: '+t); } };
  const am=$('#amb'); if(am) am.onclick=()=>openSheet(`<h3>Become a U Ambassador</h3><p class="sub" style="margin-top:8px;font-size:14px;line-height:1.5">Run sampling at your residential college, club or org fair. Earn free cans every week plus 10% on sales from your code.</p><button class="btn primary block" style="margin-top:18px" id="ambGo">Apply</button>`) || ($('#ambGo').onclick=()=>{closeSheet();toast('Application sent. We\'ll be in touch!');});
  const re=$('#restart'); if(re) re.onclick=()=>{ Object.assign(S,{home:null,onbStep:0,tab:'home',caffeine:0,log:[],box:[],subscribed:false,cans:7,place:null,mapFilter:null,examMode:false,time:'morning'}); render(); renderOnb(); };
}
function logCan(){
  const l=L(S.level); S.caffeine+=l.mg; S.log.push(S.level); S.cans++;
  render();
  const free = S.cans%10===0;
  toast(free?`That's 10! Your next can is free`:`Logged ${l.code} ${l.name}. +1 U Point`);
}

/* ================= FIT PHONE TO WINDOW ================= */
function fit(){
  const s=Math.min(1,(window.innerHeight-24)/874,(window.innerWidth-16)/420);
  $('#phoneWrap').style.transform=`scale(${s})`;
  $('#phoneWrap').style.margin=`${-(874*(1-s))/2}px ${-(420*(1-s))/2}px`;
}
window.addEventListener('resize',fit); fit();
$('#screen').addEventListener('scroll',e=>{e.target.scrollTop=0;e.target.scrollLeft=0;});
function tick(){ const d=new Date(); let h=d.getHours()%12||12; $('#clock').textContent=`${h}:${String(d.getMinutes()).padStart(2,'0')}`; }
tick(); setInterval(tick,30000);
$('#sideLogo').outerHTML = logoSVG(64);

render(); renderOnb();
</script>
</body>
</html>
